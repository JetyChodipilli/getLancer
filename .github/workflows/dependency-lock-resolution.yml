name: Resolve reviewed dependency lock
on:
  push:
    branches: ['codex/software-acceptance-closure']
    paths: ['.github/workflows/dependency-lock-resolution.yml']
permissions:
  contents: read
jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.4'}
      - name: Resolve exact patched packages without lifecycle scripts or repository writes
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {execFileSync, spawnSync} from 'node:child_process';
          const initial = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          manifest.devDependencies.vite = '8.3.5';
          manifest.overrides.undici = '7.30.1';
          manifest.overrides['fast-uri'] = '3.1.9';
          manifest.overrides.zod = '4.6.7';
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          execFileSync('npm', ['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], {stdio: 'inherit'});
          const updated = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const changed = Object.fromEntries(Object.entries(updated.packages).filter(([key, value]) => JSON.stringify(initial.packages[key]) !== JSON.stringify(value)));
          const removed = Object.keys(initial.packages).filter(key => !(key in updated.packages));
          const result = {manifest: JSON.parse(readFileSync('package.json', 'utf8')), changed, removed,
            manifestBlob: execFileSync('git', ['hash-object', 'package.json'], {encoding:'utf8'}).trim(),
            lockBlob: execFileSync('git', ['hash-object', 'package-lock.json'], {encoding:'utf8'}).trim()};
          console.log('LOCK_REFRESH_RESULT ' + JSON.stringify(result));
          const audit = spawnSync('npm', ['audit', '--audit-level=moderate', '--json'], {encoding: 'utf8'});
          const report = JSON.parse(audit.stdout);
          console.log('LOCK_REFRESH_AUDIT ' + JSON.stringify({metadata:report.metadata,vulnerabilities:report.vulnerabilities}));
          if (audit.error) throw audit.error;
          process.exitCode = audit.status ?? 1;
          JS
