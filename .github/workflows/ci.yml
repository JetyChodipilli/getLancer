name: getLancer validation (V1-V5.2)
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lab-scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4'}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.24.13', cache: false}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: {dotnet-version: '8.0.x'}
      - name: Prepare native PHP 8.3 and inspect toolchain identities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php8.3-cli
          go version
          dotnet --version
          php8.3 --version
      - name: Retrieve exact Redis source for disposable local reproduction
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: redis/redis
          ref: 335554f18caf7bbf6b0ac2b3548133d750f00a1b # Redis 7.2.16, BSD-3-Clause
          path: .ci-redis
          persist-credentials: false
      - name: Compile actual Redis without persistence or public service exposure
        run: make -C .ci-redis -j2 MALLOC=libc redis-server
      - name: Reproduce all eighteen native-language normal and failure scenarios
        run: node scripts/verify-lab-scenarios.mjs --record
        env:
          REDIS_SERVER: ${{ github.workspace }}/.ci-redis/src/redis-server
      - name: Verify native resource regressions and documented offline .NET publish
        run: |
          go test -race labs/go/server.go labs/go/server_test.go
          go vet labs/go/server.go
          php labs/php/tests.php
          node labs/dotnet/verify.mjs --sdk
      - name: Verify source package and replay version binding
        run: |
          node --experimental-strip-types scripts/build-lab-material.mjs
          node --experimental-strip-types scripts/build-lab-material.mjs --verify
      - name: Execute free source downloads without repository dependencies
        run: node scripts/verify-lab-packages.mjs
        env:
          REDIS_SERVER: ${{ github.workspace }}/.ci-redis/src/redis-server
      - name: Reproduce bounded analytics, frozen CPU inference, and clean source downloads
        run: |
          python3 --version
          node scripts/build-data-ai-material.mjs
          node scripts/build-data-ai-material.mjs --verify
          node scripts/verify-data-ai.mjs --verify
      - name: Build and verify the three original native framework previews
        run: |
          node scripts/verify-framework-previews.mjs --native
          for framework in vue svelte angular; do npm audit --prefix examples/frameworks/$framework --audit-level=moderate; done
      - name: Verify account-free laptop Docker environment with the full eighteen-core / data-AI / IoT matrix
        run: |
          docker compose -f compose.labs-local.yaml config --quiet
          node scripts/verify-iot.mjs
          node scripts/build-iot-material.mjs
          node scripts/build-iot-material.mjs --verify
          npm run labs:docker
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECURITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: getlancer_test
          POSTGRES_USER: getlancer
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U getlancer -d getlancer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: {distribution: temurin, java-version: '17', cache: maven}
      - name: Verify new backend fixtures before the complete suite
        run: |
          for name in Round3FinanceIntegrationTest Round3MarketplaceIntegrationTest Round3OperationsIntegrationTest Round3RuntimeStorageIntegrationTest; do
            test -f "backend/src/test/java/com/getlancer/integration/$name.java"
          done
          test -f backend/src/test/java/com/getlancer/config/DatabaseRoleGuardIntegrationTest.java
          mvn -B -f backend/pom.xml -Djunit.jupiter.execution.timeout.default=60s -Dsurefire.failIfNoSpecifiedTests=true -DfailIfNoTests=true -Dtest=Round3FinanceIntegrationTest,Round3MarketplaceIntegrationTest,Round3OperationsIntegrationTest,Round3RuntimeStorageIntegrationTest,DatabaseRoleGuardIntegrationTest test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          classes = ['com.getlancer.integration.' + name for name in ['Round3FinanceIntegrationTest', 'Round3MarketplaceIntegrationTest', 'Round3OperationsIntegrationTest', 'Round3RuntimeStorageIntegrationTest']]
          classes.append('com.getlancer.config.DatabaseRoleGuardIntegrationTest')
          for name in classes:
              report = ET.parse(Path('backend/target/surefire-reports') / ('TEST-' + name + '.xml')).getroot()
              cases = list(report.iter('testcase'))
              assert cases and all(not any(case.find(tag) is not None for tag in ['failure', 'error', 'skipped']) for case in cases), name
          print('Every expected backend fixture class executed nonzero passing cases.')
          PY
        env: &guarded-test-database
          TEST_DATABASE_RESET: 'true'
          TEST_DB_URL: jdbc:postgresql://localhost:5432/getlancer_test?socketTimeout=20&options=-c%20statement_timeout%3D15000
          TEST_DB_USERNAME: getlancer
          TEST_DB_PASSWORD: ci-only
          APP_BASE_URL: http://localhost:3000
          SECURE_COOKIES: 'false'
          DB_POOL_MAX: '4'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-round3-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/target/surefire-reports
          retention-days: 7
      - name: Clear generated smoke reports before complete verification
        run: rm -rf backend/target/surefire-reports
      - run: mvn -B -f backend/pom.xml -Djunit.jupiter.execution.timeout.default=60s verify
        env: *guarded-test-database
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4'}
      - name: Bind reviewed GET assessments to passing security regressions
        run: node scripts/sast-dispositions.mjs --write-evidence
      - name: Bind named implementation repairs to passing PostgreSQL tests
        run: node scripts/phase-completion-evidence.mjs backend
        env:
          PHASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/target/surefire-reports
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-backend-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/target/phase-completion-evidence.json
          retention-days: 7
      - name: Verify production JAR excludes test mocks and frontend simulations
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('backend/target/getlancer-api-1.0.0-SNAPSHOT.jar') as jar:
              entries = jar.namelist()
          assert 'BOOT-INF/classes/com/getlancer/Application.class' in entries
          assert not any(name.startswith('BOOT-INF/lib/') and any(tag in name for tag in ('mockito', 'junit', 'spring-boot-test', 'spring-test')) for name in entries), 'Test dependencies leaked into the runtime JAR'
          assert not any(name.startswith('BOOT-INF/classes/com/getlancer/') and ('Test.class' in name or 'RazorpayFixture' in name or '/testing/' in name or '/integration/' in name or '/architecture/' in name) for name in entries), 'Test fixtures leaked into runtime classes'
          assert not any(tag in name for name in entries for tag in ('demo-state', 'team-demo', 'business-demo', 'workspace-preview', 'delivery-preview', 'template-preview')), 'Frontend simulations leaked into the Java artifact'
          print('Production Java artifact contains application code and runtime dependencies only.')
          PY
      - name: Generate runtime Java dependency and license inventory
        run: mvn -B -f backend/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=false -DoutputFormat=json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4'}
      - name: Scan Java runtime dependencies against OSV
        run: node scripts/audit-sbom.mjs backend/target/bom.json backend/target/dependency-audit.json --backend-rest-assessment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-dependency-evidence-${{ github.sha }}
          path: |
            backend/target/bom.json
            backend/target/dependency-audit.json
          retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4', cache: npm}
      - run: npm ci
      - name: Verify runtime npm advisories and inventory
        run: |
          mkdir -p dependency-evidence
          npm audit --omit=dev --audit-level=high --json > dependency-evidence/npm-audit.json
          npm audit --audit-level=moderate --json > dependency-evidence/npm-full-audit.json
          npm sbom --omit=dev --sbom-format=cyclonedx > dependency-evidence/frontend-bom.json
          node scripts/audit-sbom.mjs dependency-evidence/frontend-bom.json dependency-evidence/frontend-osv.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-dependency-evidence-${{ github.sha }}
          path: dependency-evidence
          retention-days: 7
      - name: Lint changed source with repository rules
        run: node scripts/lint-changed.mjs
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_HEAD_SHA: ${{ github.sha }}
      - run: npx tsc --noEmit
      - name: Rebuild original Vue, Svelte and Angular previews from pinned source
        run: node scripts/verify-framework-previews.mjs --native
      - run: npm run build
      - name: Check published frontend assets for private keys and source maps
        run: node scripts/check-frontend-security.mjs
      - name: Verify V5.2 content and requirement evidence coverage
        run: |
          node scripts/v52-content.mjs
          node scripts/v52-release-contract.mjs
      - name: Verify typed authorization and database privilege source contracts
        run: |
          node scripts/check-security-contract.mjs
          node ops/database/check-permissions.mjs
      - name: Verify separate provider protocol and durable lifecycle regressions
        run: python3 -m unittest discover -s ops/lab-provider -p 'test_*.py'
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Install browsers for responsive and cross-engine acceptance
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify Paper & Pixel discovery, auth and browser gaps
        run: npx playwright test --config playwright.paper.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: paper-pixel-browser-evidence-${{ github.sha }}
          path: |
            test-results/paper-pixel
            playwright-report/paper-pixel
          retention-days: 7
      - name: Verify Round 3 browser fixtures before retained audit and full suites
        run: |
          for name in identity marketplace ui; do test -f "tests/browser/round3-$name.spec.ts"; done
          npx playwright test tests/browser/round3-*.spec.ts --workers=2 --max-failures=1 --output=test-results-round3-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-round3-smoke-${{ github.sha }}
          path: test-results-round3-smoke
          retention-days: 7
      - name: Verify new audit browser fixtures before the full responsive suite
        run: npx playwright test tests/browser/round2-*.spec.ts --workers=2 --max-failures=1
      - name: Verify desktop, phone and tablet workspace journeys
        run: npx playwright test --workers=2 --max-failures=3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-browser-evidence-${{ github.sha }}
          path: test-results
          retention-days: 7
      - name: Retain focused Paper & Pixel design review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: liquid-design-evidence-${{ github.sha }}
          path: |
            test-results/liquid-design-*/**/*.jpg
            test-results/liquid-design-*/**/*.png
            test-results/liquid-design-*/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1
  docker-startup:
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: getlancer-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist
      - name: Install native Worker verification runtime
        run: npm ci
      - name: Prepare synthetic local credentials
        run: |
          cp .env.example .env
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          writeFileSync('.env',readFileSync('.env','utf8').replace(/^ADMIN_EMAIL=.*$/m,'ADMIN_EMAIL=ci-admin@example.test'),{mode:0o600});
          JS
          node scripts/setup-local.mjs --docker
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          let value=readFileSync('.env','utf8').replace(/^ADMIN_EMAIL=.*$/m,'ADMIN_EMAIL=ci-admin@example.test');
          const hosting={COMPOSE_PROFILES:'hosting',HOSTED_DEMOS_ENABLED:'true',DEMO_PUBLISHER_URL:'http://demo-publisher:8090',DEMO_PUBLIC_URL_TEMPLATE:'http://{id}.demo.localhost:8090',DEMO_PUBLISHER_SECRET:randomBytes(32).toString('hex'),DEMO_GATEWAY_SECRET:randomBytes(32).toString('hex')};
          value=value.split('\n').filter(line=>!Object.keys(hosting).some(key=>line.startsWith(key+'='))).join('\n')+'\n'+Object.entries(hosting).map(([key,value])=>key+'='+value).join('\n')+'\n';
          writeFileSync('.env',value,{mode:0o600});
          JS
      - run: docker compose config --quiet
      - name: Validate standalone staging manifest
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const values={APP_ENV:'staging',APP_BASE_URL:'https://app.example.test',BACKEND_URL:'https://api.example.test',DB_URL:'jdbc:postgresql://db.example.test:5432/getlancer?sslmode=verify-full&sslrootcert=/run/secrets/postgres-ca.crt',DB_SCHEMA:'getlancer',BACKEND_PROXY_SECRET:randomBytes(32).toString('hex'),SMTP_HOST:'smtp.example.test',SMTP_USERNAME:'ci-fixture',SMTP_PASSWORD:randomBytes(32).toString('hex'),SMTP_AUTH:'true',SMTP_TLS:'true',EMAIL_FROM_ADDRESS:'operator@example.test',OBJECT_STORAGE_ENDPOINT:'https://storage.example.test',OBJECT_STORAGE_UPLOAD_ENDPOINT:'https://storage.example.test',OBJECT_STORAGE_REGION:'test-region',OBJECT_STORAGE_BUCKET:'private-ci-fixture',OBJECT_STORAGE_ACCESS_KEY:randomBytes(32).toString('hex'),OBJECT_STORAGE_SECRET_KEY:randomBytes(32).toString('hex'),HOSTED_DEMOS_ENABLED:'false'};
          const value=readFileSync('.env','utf8').split('\n').filter(line=>!Object.keys(values).some(key=>line.startsWith(key+'='))).join('\n')+'\n'+Object.entries(values).map(([key,value])=>key+'='+value).join('\n')+'\n';
          writeFileSync('.env.staging',value,{mode:0o600});
          JS
          BACKEND_IMAGE=getlancer-api:ci-validation DB_CA_FILE=/tmp/ci-postgres-ca.crt docker compose --env-file .env.staging -f compose.staging.yaml config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify connected production frontend against the empty Java database
        run: node scripts/verify-connected-frontend.mjs
      - name: Verify connected V1 through V4 service journeys and database recovery
        run: node scripts/smoke-docker.mjs
      - name: Prepare isolated V1 browser journey actors and prerequisites
        run: node scripts/ci-v1-fixture.mjs
      - name: Verify connected frontend after real service journeys
        run: node scripts/verify-connected-frontend.mjs
      - name: Install connected browser test runner
        run: npx playwright install --with-deps chromium
      - name: Verify original V1 and hiring, delivery, source, maintenance and hosted demo browser journeys
        run: npx playwright test --config playwright.connected.config.ts --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/connected/results.json
      - name: Bind all six original browser journeys and viewport results
        run: node scripts/phase-completion-evidence.mjs connected
        env:
          PHASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: connected-browser-evidence-${{ github.sha }}
          path: test-results/connected
          retention-days: 7
      - name: Rehearse encrypted database restore in disposable CI
        run: node scripts/verify-restore-ci.mjs
      - name: Show startup diagnostics on failure
        if: failure()
        run: docker compose logs --tail=80 api db storage-init demo-publisher
      - name: Remove disposable CI containers and volumes
        if: always()
        run: |
          rm -f .ci-connected.json
          docker compose down --volumes

  secrets-and-sast:
    needs: backend
    env:
      SECURITY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The release gate must include existing findings on PRs as well as pushes.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: java-kotlin, build-mode: manual}
          - {language: javascript-typescript, build-mode: none}
          - {language: python, build-mode: none}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4', cache: npm}
      - name: Install verified Gitleaks release
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks security-evidence
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
      - name: Scan secrets in the current tree and complete Git history
        id: secrets
        continue-on-error: true
        run: |
          status=0
          /tmp/gitleaks/gitleaks dir --config .gitleaks.toml --redact --report-format json --report-path security-evidence/tree-secrets.json . || status=1
          /tmp/gitleaks/gitleaks git --config .gitleaks.toml --redact --report-format json --report-path security-evidence/history-secrets.json . || status=1
          exit "$status"
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Java for semantic security analysis
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f backend/pom.xml -DskipTests package
      - name: Compile native Java teaching source for semantic security analysis
        if: matrix.language == 'java-kotlin'
        run: javac -d /tmp/getlancer-lab-analysis labs/java/LabServer.java
      - name: Retrieve current security test evidence for reviewed GET assessments
        if: matrix.language == 'java-kotlin'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/target/surefire-reports
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          output: security-evidence/codeql
          upload: false
      - name: Block high and critical semantic security findings
        run: node scripts/check-sast-results.mjs security-evidence/codeql ${{ matrix.language == 'java-kotlin' && '--reviewed-get-assessments' || '' }}
      - name: Require both secret scans to pass
        if: always()
        env:
          SECRET_SCAN_OUTCOME: ${{ steps.secrets.outcome }}
        run: test "$SECRET_SCAN_OUTCOME" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-scan-evidence-${{ matrix.language }}-${{ github.sha }}
          path: security-evidence
          retention-days: 7
  container-security:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.4'}
      - name: Retrieve passing runtime MVC security evidence from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: backend/target/surefire-reports
      - name: Retrieve current dependency applicability evidence from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: java-dependency-evidence-${{ github.sha }}
          path: backend/target
      - name: Install verified Trivy release
        run: |
          curl --fail --location --silent --show-error https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/trivy.tar.gz' | sha256sum --check
          mkdir -p /tmp/trivy security-evidence
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy trivy
      - name: Build reviewed runtime images without pushing
        run: |
          docker build -t getlancer-api:scan backend
          docker build -t getlancer-publisher:scan ops/demo-publisher
      - name: Block high and critical runtime image vulnerabilities
        run: |
          /tmp/trivy/trivy image --scanners vuln --format json --output security-evidence/api-image.json getlancer-api:scan
          /tmp/trivy/trivy image --scanners vuln --format json --output security-evidence/publisher-image.json getlancer-publisher:scan
          status=0
          node scripts/check-container-results.mjs security-evidence/api-image.json security-evidence/api-image-assessed.json getlancer-api:scan --backend-rest-assessment || status=1
          node scripts/check-container-results.mjs security-evidence/publisher-image.json security-evidence/publisher-image-assessed.json getlancer-publisher:scan || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-scan-evidence-${{ github.sha }}
          path: security-evidence
          retention-days: 7
