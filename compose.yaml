services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: getlancer
      POSTGRES_USER: getlancer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getlancer']
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025']
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [objects:/data]
  api:
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/getlancer
      DB_USERNAME: getlancer
      SMTP_HOST: mail
      SMTP_PORT: 1025
      OBJECT_STORAGE_ENDPOINT: http://storage:9000
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
      storage: {condition: service_started}
  test-db:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: getlancer_test
      POSTGRES_USER: getlancer
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getlancer -d getlancer_test']
      interval: 5s
      retries: 10
  verify:
    profiles: [test]
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /source
    command: ['mvn', '-B', '-f', 'backend/pom.xml', 'verify']
    volumes: ['./backend:/source/backend']
    environment:
      TEST_DATABASE_RESET: 'true'
      TEST_DB_URL: jdbc:postgresql://test-db:5432/getlancer_test
      TEST_DB_USERNAME: getlancer
      TEST_DB_PASSWORD: disposable-test-only
      APP_BASE_URL: http://localhost:3000
      SECURE_COOKIES: 'false'
    depends_on:
      test-db: {condition: service_healthy}
volumes:
  database:
  objects:
