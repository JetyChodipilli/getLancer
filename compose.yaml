services:
  db:
    image: postgres:16-alpine
    user: postgres
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m', '/var/run/postgresql:rw,nosuid,size=16m,mode=0777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    environment:
      POSTGRES_DB: getLancer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ['127.0.0.1:5433:5432']
    # Separate volume preserves any existing database from older Compose setups.
    volumes: [docker-database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d getLancer']
      interval: 5s
      timeout: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  storage:
    build:
      context: ./ops/minio
      target: server
    user: storage
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [objects:/data]
  storage-init:
    build:
      context: ./ops/minio
      target: client
    user: storage
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    depends_on: [storage]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?Run npm run setup:docker}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?Run npm run setup:docker}
      BUCKET: ${OBJECT_STORAGE_BUCKET:-getlancer}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        attempts=0
        until mc alias set local http://storage:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" --quiet; do
          attempts=$$((attempts+1))
          [ "$$attempts" -lt 20 ] || exit 1
          sleep 2
        done
        mc mb --ignore-existing "local/$$BUCKET" && mc anonymous set none "local/$$BUCKET"
  api:
    build: ./backend
    user: getlancer
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    init: true
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_ENV: local
      DB_URL: jdbc:postgresql://db:5432/getLancer
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      RAZORPAY_MODE: ${RAZORPAY_MODE:-test}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_COMMERCE_WEBHOOK_SECRET: ${RAZORPAY_COMMERCE_WEBHOOK_SECRET:-}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-false}
      RAZORPAY_SUBSCRIPTIONS_APPROVED: ${RAZORPAY_SUBSCRIPTIONS_APPROVED:-false}
      RAZORPAY_MAINTENANCE_WEBHOOK_SECRET: ${RAZORPAY_MAINTENANCE_WEBHOOK_SECRET:-}
      MAINTENANCE_RECONCILE_INTERVAL_MS: ${MAINTENANCE_RECONCILE_INTERVAL_MS:-60000}
      HOSTED_DEMOS_ENABLED: ${HOSTED_DEMOS_ENABLED:-false}
      DEMO_PUBLISHER_URL: ${DEMO_PUBLISHER_URL:-http://demo-publisher:8090}
      DEMO_PUBLISHER_SECRET: ${DEMO_PUBLISHER_SECRET:-}
      DEMO_GATEWAY_SECRET: ${DEMO_GATEWAY_SECRET:-}
      DEMO_PUBLIC_URL_TEMPLATE: ${DEMO_PUBLIC_URL_TEMPLATE:-}
      DEMO_EXPIRY_DAYS: ${DEMO_EXPIRY_DAYS:-7}
      DEMO_PUBLISHER_TIMEOUT_MS: ${DEMO_PUBLISHER_TIMEOUT_MS:-5000}
      DISCOVERY_RATE_LIMIT_PER_MINUTE: ${DISCOVERY_RATE_LIMIT_PER_MINUTE:-300}
      RAZORPAY_ROUTE_APPROVED: ${RAZORPAY_ROUTE_APPROVED:-false}
      DB_USERNAME: postgres
      SMTP_HOST: mail
      SMTP_PORT: 1025
      OBJECT_STORAGE_ENDPOINT: http://storage:9000
      OBJECT_STORAGE_UPLOAD_ENDPOINT: http://localhost:9000
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8080/actuator/health/readiness']
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12
  demo-publisher:
    profiles: [hosting]
    build: ./ops/demo-publisher
    user: node
    environment:
      DEMO_PUBLISHER_PORT: 8090
      DEMO_PUBLISHER_ADMIN_HOST: demo-publisher:8090
      DEMO_PUBLISHER_SECRET: ${DEMO_PUBLISHER_SECRET:-}
      DEMO_GATEWAY_SECRET: ${DEMO_GATEWAY_SECRET:-}
      DEMO_GATEWAY_URL: http://api:8080/api/v1/hosting/gateway
      DEMO_PUBLIC_URL_TEMPLATE: ${DEMO_PUBLIC_URL_TEMPLATE:-}
      DEMO_PUBLISHER_DATA_DIR: /data
    ports: ['127.0.0.1:8090:8090']
    volumes: [demo-bundles:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
  test-db:
    profiles: [test]
    image: postgres:16-alpine
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    environment:
      POSTGRES_DB: getlancer_test
      POSTGRES_USER: getlancer
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs: ['/var/lib/postgresql/data:rw,nosuid,size=256m,uid=70,gid=70,mode=0700', '/tmp:rw,noexec,nosuid,size=64m', '/var/run/postgresql:rw,nosuid,size=16m,mode=0777']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getlancer -d getlancer_test']
      interval: 5s
      retries: 10
  verify:
    profiles: [test]
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /source
    command: ['mvn', '-B', '-f', 'backend/pom.xml', 'verify']
    volumes: ['./backend:/source/backend']
    environment:
      TEST_DATABASE_RESET: 'true'
      TEST_DB_URL: jdbc:postgresql://test-db:5432/getlancer_test
      TEST_DB_USERNAME: getlancer
      TEST_DB_PASSWORD: disposable-test-only
      APP_BASE_URL: http://localhost:3000
      SECURE_COOKIES: 'false'
    depends_on:
      test-db: {condition: service_healthy}
volumes:
  docker-database:
  objects:
  demo-bundles:
