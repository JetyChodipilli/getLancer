spring.application.name=getlancer-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/getLancer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.origin=${APP_BASE_URL:http://localhost:3000}
app.environment=${APP_ENV:local}
app.email-from=${EMAIL_FROM_ADDRESS:notifications@getlancer.local}
app.secure-cookie=${SECURE_COOKIES:true}
app.rate-limit=${RATE_LIMIT_PER_MINUTE:30}
app.admin-email=${ADMIN_EMAIL:jetychodipilli@gmail.com}
# Keep bootstrap secrets in the backend environment, never in source control.
app.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-totp=${ADMIN_TOTP_SECRET:}
app.storage.endpoint=${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
app.storage.bucket=${OBJECT_STORAGE_BUCKET:getlancer}
app.storage.region=${OBJECT_STORAGE_REGION:us-east-1}
app.storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:}
app.storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:}

# Optional Google OpenID Connect. Secrets belong only in the backend environment.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Background delivery/expiry jobs may be disabled in isolated tests.
app.jobs-enabled=${JOBS_ENABLED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}

# GitHub OAuth app credentials; backend only.
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}

# Native Spring import: environment variables override these optional local files.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.hikari.schema=${DB_SCHEMA:public}
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.schemas=${DB_SCHEMA:public}
spring.flyway.create-schemas=true
app.proxy-secret=${BACKEND_PROXY_SECRET:}
app.auth-rate-limit=${AUTH_RATE_LIMIT_PER_MINUTE:10}
app.email-rate-limit=${EMAIL_RATE_LIMIT_PER_MINUTE:3}
app.analytics-enabled=${ANALYTICS_ENABLED:false}
app.analytics-salt=${ANALYTICS_HASH_SALT:}
app.analytics-retention-days=${ANALYTICS_RETENTION_DAYS:90}
app.reliability-min-sample=${PUBLIC_RELIABILITY_MIN_SAMPLE:10}
app.legal-version=${LEGAL_DOCUMENT_VERSION:v1-draft}
app.policies-approved=${POLICIES_APPROVED:false}
app.support-email=${SUPPORT_EMAIL:}
app.privacy-email=${PRIVACY_EMAIL:}
app.copyright-email=${COPYRIGHT_EMAIL:}
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

app.storage.upload-endpoint=${OBJECT_STORAGE_UPLOAD_ENDPOINT:${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}}
