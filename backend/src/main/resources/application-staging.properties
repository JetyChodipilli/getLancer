# Hosted runtime: environment injection only. Migrations run as a separate operator job.
spring.flyway.enabled=false
spring.flyway.create-schemas=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${DB_SCHEMA}
spring.flyway.default-schema=${DB_SCHEMA}
spring.flyway.schemas=${DB_SCHEMA}
app.origin=${APP_BASE_URL}
app.backend-url=${BACKEND_URL}
app.environment=${APP_ENV}
app.secure-cookie=${SECURE_COOKIES:true}
